[package]
name = "wenv"
version = "0.21.0"
edition = "2021"
authors = ["wen"]
description = "Shell configuration file manager - Cross-platform Shell RC file management tool"
license = "MIT"
repository = "https://github.com/superyngo/wenv"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
toml = "0.8"

# Regular expressions
regex = "1"
lazy_static = "1"

# Path handling
dirs = "5"

# Interactive prompts
dialoguer = "0.11"

# TUI framework
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
unicode-width = "0.1"

# Error handling
anyhow = "1"

# File searching and fuzzy matching  
glob = "0.3"
fuzzy-matcher = "0.3"
tempfile = "3"
trash = "5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
